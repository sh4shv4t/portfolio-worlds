# Deploys to GitHub Pages on every push to main.
# Live at https://sh4shv4t.github.io/portfolio-worlds/ (Pages source: "GitHub Actions").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly rebuild so new Medium posts show up

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://sh4shv4t.github.io
      # Project site, so it lives under the repo name. Every link goes through
      # the base-path helper (src/site.ts url()), so this one value moves the whole site.
      BASE: /portfolio-worlds
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
